[project]
name = "autosota-repro"
version = "0.1.0"
description = "Reproduction of AutoSOTA: Automated SOTA optimization system"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.106.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "docker>=7.0",
    "gitpython>=3.1",
    "pymupdf4llm>=0.0.20",
    "tiktoken>=0.6",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "aiofiles>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-aiofiles>=24.0",
]

[project.scripts]
autosota = "autosota.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosota"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
